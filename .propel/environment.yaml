stack: node-vitest+python-pytest
install_cmd: (npm install) && (python3 -m pip install -r requirements.in)
syntax_cmd: (find . -path ./node_modules -prune -o \( -name '*.js' -o -name '*.mjs'
  -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check) && (python -c "import
  os, sys; S = {'node_modules', '.venv', '.propel', 'vendor', '.git', '__pycache__',
  'dist', 'build', '.tox', '.mypy_cache'}; P = [os.path.join(r, f) for r, d, fs in
  os.walk('.') if not d.__setitem__(slice(None), [x for x in d if x not in S]) for
  f in fs if f.endswith('.py')]; [compile(open(p, encoding='utf-8').read(), p, 'exec')
  for p in P]")
build_cmd: (npm run build --if-present) && (python3 -m compileall -q -x '/(node_modules|\.venv|\.propel|vendor|\.git)/'
  .)
test_cmd: (echo __PROPEL_STACK__:node-vitest; npx vitest run --globals --environment
  jsdom) && (echo __PROPEL_STACK__:python-pytest; python3 -m pytest -q)
test_selector: PROPEL_TEST="{path}"; case "$PROPEL_TEST" in *) echo __PROPEL_STACK__:node-vitest;
  (npx vitest run {path} --globals --environment jsdom) ;; esac
dependency_file: package.json
runtime_version: '22'
member_dirs:
  node-vitest: .
  python-pytest: .
